<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>FDV Terapias de Marca</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f7f8fb; --border:#e1e5ee; --border-strong:#cbd2df;
  --text:#14213d; --text-2:#4a5672; --muted:#7a849b;
  --brand:#123a73; --brand-2:#1d5fb4; --brand-soft:#e7effb; --accent:#0f9488;
  --good:#0ca30c; --good-text:#0a6b0a; --good-soft:#e5f6e5;
  --warn:#fab219; --warn-text:#8a5a00; --warn-soft:#fff4dc;
  --bad:#d03b3b; --bad-text:#b12c2c; --bad-soft:#fdeaea;
  --bar:#2a78d6; --track:#edf0f5;
  --a1:#2a78d6; --a2:#eb6834; --a3:#1baf7a; --a4:#eda100; --a5:#e87ba4; --a6:#008300; --a7:#6250d6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f141c; --surface:#171d27; --surface-2:#1c2330; --border:#2a3342; --border-strong:#3a4558;
    --text:#eef1f6; --text-2:#b9c2d3; --muted:#8a95aa;
    --brand:#8db8f2; --brand-2:#5b9cec; --brand-soft:#1d2b40; --accent:#2cc2b2;
    --good-text:#5fd35f; --good-soft:#15301a; --warn-text:#fac557; --warn-soft:#33290f; --bad-text:#f08585; --bad-soft:#3a1c1c;
    --bar:#3987e5; --track:#252e3c;
    --a1:#3987e5; --a2:#d95926; --a3:#199e70; --a4:#c98500; --a5:#d55181; --a6:#008300; --a7:#9085e9;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f141c; --surface:#171d27; --surface-2:#1c2330; --border:#2a3342; --border-strong:#3a4558;
  --text:#eef1f6; --text-2:#b9c2d3; --muted:#8a95aa;
  --brand:#8db8f2; --brand-2:#5b9cec; --brand-soft:#1d2b40; --accent:#2cc2b2;
  --good-text:#5fd35f; --good-soft:#15301a; --warn-text:#fac557; --warn-soft:#33290f; --bad-text:#f08585; --bad-soft:#3a1c1c;
  --bar:#3987e5; --track:#252e3c;
  --a1:#3987e5; --a2:#d95926; --a3:#199e70; --a4:#c98500; --a5:#d55181; --a6:#008300; --a7:#9085e9;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
.num{font-variant-numeric:tabular-nums}
/* header */
.top{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-in,.tabs,.filters,main{padding-left:max(20px,env(safe-area-inset-left,0px))!important;padding-right:max(20px,env(safe-area-inset-right,0px))!important}
.top-in{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:220px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#123a73,#1d5fb4);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;flex:none}
.brand h1{font-size:16px;margin:0;line-height:1.2}
.brand p{margin:0;color:var(--muted);font-size:12px}
.tabs{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--text-2);cursor:pointer;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--brand-2);border-bottom-color:var(--brand-2)}
.tab .cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;font-size:11px;background:var(--bad);color:#fff;margin-left:4px;text-align:center}
.filters{max-width:1400px;margin:16px auto 0;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;position:relative}
.search input[type=search]{width:100%;padding:9px 12px 9px 34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-2) 20%,transparent)}
.fld{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px}
.fld input[type=number]{width:70px}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px;cursor:pointer;user-select:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad-text);border-color:color-mix(in srgb,var(--bad) 40%,var(--border))}
.btn.sm{padding:4px 8px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;line-height:0}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn.del:hover{color:var(--bad-text)}
main{max-width:1400px;margin:0 auto;padding:16px 20px 60px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
.g-3{grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.card-h h2{font-size:15px;margin:0}
.card-h .sub{color:var(--muted);font-size:12px;margin:2px 0 0}
.card-b{padding:14px 16px 16px}
.kpi{padding:14px 16px}
.kpi .lbl{color:var(--text-2);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-size:28px;font-weight:700;margin-top:4px;line-height:1.1}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:6px}
.kpi .val.txt{font-size:17px}
.status{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.status.good{background:var(--good-soft);color:var(--good-text)}
.status.bad{background:var(--bad-soft);color:var(--bad-text)}
.status.warn{background:var(--warn-soft);color:var(--warn-text)}
.status.neutral{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.t-good{color:var(--good-text)} .t-bad{color:var(--bad-text)} .t-warn{color:var(--warn-text)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.section-title h2{font-size:17px;margin:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* risk */
.risk{border:1px solid color-mix(in srgb,var(--bad) 45%,var(--border));background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box;border-left:5px solid var(--bad);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.risk-h{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--bad-soft);border-radius:8px 11px 0 0;flex-wrap:wrap}
.risk-h h2{margin:0;font-size:16px;color:var(--bad-text)}
.risk-h p{margin:0;font-size:12.5px;color:var(--text-2)}
.risk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px;padding:14px 16px}
.risk-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface)}
.risk-item .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.risk-item ul{margin:6px 0 0;padding-left:18px;color:var(--text-2);font-size:12.5px}
.risk-ok{display:flex;gap:10px;align-items:center;padding:12px 16px;border:1px solid var(--border);border-left:5px solid var(--good);border-radius:var(--radius);background:var(--surface);margin-bottom:16px}
/* bars */
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(110px,190px) 1fr 52px;gap:10px;align-items:center;font-size:13px;padding:2px 0;border-radius:6px}
.bar-row:hover{background:var(--surface-2)}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.bar-row .lab small{color:var(--muted)}
.track{position:relative;height:14px;background:var(--track);border-radius:4px}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0}
.fill.bad{background:var(--bad)}
.minline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55;border-radius:1px}
.bar-row .v{text-align:right;font-weight:600}
.bar-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.sw.line{width:2px;height:12px;background:var(--text);opacity:.55;border-radius:1px}
/* table */
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--border)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-2);font-weight:600;background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th .arr{opacity:.35;margin-left:3px;font-size:10px}
th.sorted .arr{opacity:1;color:var(--brand-2)}
td.r,th.r{text-align:right}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
tr.inactive td{opacity:.55}
tr.expandable{cursor:pointer}
tr.sub td{background:var(--surface-2);padding:10px 16px 14px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.muted{color:var(--muted)}
.chev{display:inline-block;transition:transform .15s;color:var(--muted);margin-right:4px}
tr.open .chev{transform:rotate(90deg)}
/* line chips */
.linesum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.linesum .card{padding:10px 12px;cursor:pointer}
.linesum .card.on{outline:2px solid var(--brand-2)}
.linesum .t{font-weight:700;font-size:13px}
.linesum .s{font-size:12px;color:var(--muted)}
/* portfolio */
.areas-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-2)}
.areas-legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.pline{display:flex;flex-direction:column}
.pline.drag-over{outline:2px dashed var(--brand-2);outline-offset:-2px}
.pline .card-b{flex:1}
.agroup{margin-bottom:10px}
.agroup h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:4px 4px 4px 8px;font-size:12.5px;font-weight:500;cursor:grab}
.chip:active{cursor:grabbing}
.chip.dragging{opacity:.4}
.chip.hl{box-shadow:0 0 0 2px var(--warn)}
.chip .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 3px;font-size:14px;line-height:1;border-radius:4px}
.chip .x:hover{color:var(--bad-text);background:var(--bad-soft)}
.chip .mv{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 3px;font-size:12px;border-radius:4px}
.chip .mv:hover{color:var(--brand-2);background:var(--brand-soft)}
.matrix td.c,.matrix th.c{text-align:center}
.tick{display:inline-block;width:18px;height:18px;border-radius:5px;background:var(--brand-2);color:#fff;font-size:12px;line-height:18px;cursor:pointer}
.tick.off{background:transparent;border:1px dashed var(--border-strong);color:transparent}
.tick.off:hover{border-color:var(--brand-2)}
/* fichero */
.quota-cell{display:flex;align-items:center;gap:8px;min-width:140px}
.quota-cell .track{flex:1;height:10px}
.retired td{color:var(--muted)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,28,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.3);border:1px solid var(--border)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{margin:0;font-size:16px}
.modal-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-b .full{grid-column:1/-1}
.modal-b label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--text-2);font-weight:500}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border)}
@media (max-width:520px){.modal-b{grid-template-columns:1fr}}
/* tooltip/toast/menu */
#tip{position:fixed;pointer-events:none;background:var(--text);color:var(--surface);padding:6px 9px;border-radius:7px;font-size:12px;max-width:280px;z-index:60;display:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#toasts{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:var(--text);color:var(--surface);padding:10px 14px;border-radius:9px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:340px;animation:tin .2s ease}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;min-width:230px;display:none;z-index:40}
.menu-pop.on{display:block}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop hr{border:0;border-top:1px solid var(--border);margin:4px 0}
/* kahoot */
textarea.paste{width:100%;min-height:170px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;resize:vertical}
.form-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
.form-row label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--text-2);font-weight:500}
.drop{border:2px dashed var(--border-strong);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
.drop.on{border-color:var(--brand-2);background:var(--brand-soft)}
.note{font-size:12.5px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.note ul{margin:4px 0 0;padding-left:18px}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin-top:8px}
.kv b{color:var(--text)}
@media (max-width:640px){
  .top-in,.tabs,.filters,main{padding-left:max(16px,env(safe-area-inset-left,0px))!important;padding-right:max(16px,env(safe-area-inset-right,0px))!important}
  .bar-row{grid-template-columns:100px 1fr 44px}
  .kpi .val{font-size:24px}
}
body.ro [data-act="add-vis"],body.ro [data-act="edit-vis"],body.ro [data-act="toggle-vis"],body.ro [data-act="del-vis"],body.ro [data-act="add-eval"],body.ro [data-act="edit-eval"],body.ro [data-act="del-eval"],body.ro [data-act="add-prod"],body.ro [data-act="del-prod"],body.ro [data-act="move-prod"],body.ro [data-act="add-med"],body.ro [data-act="edit-med"],body.ro [data-act="del-med"],body.ro [data-act="k-commit"],body.ro [data-act="imp-json"]{display:none!important}
body.ro .tick{pointer-events:none}
body.ro .chip{cursor:default}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media print{.top,.filters,.toolbar,.iconbtn,.btn{display:none!important}.card{box-shadow:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo" aria-hidden="true">FDV</div>
      <div><h1>Fuerza de Ventas · Terapias de Marca</h1><p>Nueva estructura promocional · vigente desde Octubre 2026</p></div>
    </div>
    <div class="toolbar">
      <span class="status neutral" id="syncStatus" aria-live="polite">Conectando…</span>
      <button class="btn ghost" id="btnTheme" title="Cambiar tema" aria-label="Cambiar tema">◐ Tema</button>
      <div class="menu">
        <button class="btn" id="btnData" aria-haspopup="true">Datos ▾</button>
        <div class="menu-pop" id="dataMenu" role="menu">
          <button data-act="exp-json">⬇ Exportar respaldo (JSON)</button>
          <button data-act="imp-json">⬆ Importar respaldo (JSON)</button>
          <hr>
          <button data-act="exp-evals">⬇ Exportar evaluaciones (CSV)</button>
          <button data-act="exp-fdv">⬇ Exportar FDV (CSV)</button>
          <button data-act="exp-port">⬇ Exportar portafolio (CSV)</button>
        </div>
        <input type="file" id="fileJson" accept=".json,application/json" hidden>
      </div>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" data-tab="resumen">Métricas y KPIs</button>
    <button class="tab" data-tab="fdv">Fuerza de Ventas</button>
    <button class="tab" data-tab="evals">Evaluaciones</button>
    <button class="tab" data-tab="port">Portafolio</button>
    <button class="tab" data-tab="fichero">Fichero Médico</button>
    <button class="tab" data-tab="carga">Cargar Kahoot</button>
  </nav>
</header>

<section class="filters" aria-label="Filtros">
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="Buscar visitador, correo, examen, producto, médico…" autocomplete="off">
  </div>
  <select id="fLinea" aria-label="Filtrar por línea"></select>
  <select id="fVis" aria-label="Filtrar por visitador"></select>
  <label class="fld" title="Nota mínima aprobatoria (escala 0–20)">Mín. aprobatorio <input type="number" id="fMin" min="0" max="20" step="0.5"> /20</label>
  <label class="chk" title="Si se activa, los registros 'No presentó' cuentan como nota 0 en promedios y tasas"><input type="checkbox" id="fAus"> Ausencias = 0</label>
  <button class="btn ghost sm" id="btnClear">Limpiar filtros</button>
</section>

<main id="view"></main>

function table(key, cols, rows, opts={}){
  const st = UI.sort[key] || opts.defaultSort || {k:cols[0].k, dir:1};
  const col = cols.find(c => c.k === st.k) || cols[0];
  const sv = col.sv || (r => r[col.k]);
  const sorted = [...rows].sort((a,b) => {
    let x = sv(a), y = sv(b);
    if (x == null || x === '') return 1; if (y == null || y === '') return -1;
    return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'es', {numeric:true})) * st.dir;
  });
  const head = cols.map(c => c.nosort ? `<th class="${c.r?'r':''}">${c.label}</th>` :
    `<th class="sortable ${c.r?'r':''} ${st.k===c.k?'sorted':''}" data-sort="${key}" data-k="${c.k}" aria-sort="${st.k===c.k?(st.dir>0?'ascending':'descending'):'none'}">${c.label}<span class="arr">${st.k===c.k?(st.dir>0?'▲':'▼'):'⇅'}</span></th>`).join('');
  const body = sorted.length ? sorted.map(r => {
    const tr = `<tr ${opts.rowAttr ? opts.rowAttr(r) : ''}>${cols.map(c => `<td class="${c.r?'r num':''}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join('')}</tr>`;
    return tr + (opts.after ? opts.after(r) : '');
  }).join('') : `<tr><td colspan="${cols.length}" class="empty">${opts.empty || 'Sin resultados para los filtros actuales.'}</td></tr>`;
  return `<div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- bars ---------- */
function bars(items, opts={}){
  const min = S.config.min;
  if (!items.length) return '<div class="empty">Sin datos para mostrar.</div>';
  return `<div class="bars">${items.map(it => {
    const w = Math.max(0, Math.min(100, (it.value ?? 0) / 20 * 100));
    const bad = it.value != null && it.value < min;
    return `<div class="bar-row" data-tip="${esc(it.tip)}"><div class="lab">${it.label}</div>
      <div class="track"><div class="fill ${bad?'bad':''}" style="width:${w}%"></div><div class="minline" style="left:calc(${min/20*100}% - 1px)"></div></div>
      <div class="v num ${bad?'t-bad':''}">${bad?'▼ ':''}${fmt(it.value)}</div></div>`;
  }).join('')}</div>
  <div class="bar-legend"><span><i class="sw" style="background:var(--bar)"></i>Promedio ≥ mínimo</span><span><i class="sw" style="background:var(--bad)"></i>▼ Bajo el mínimo</span><span><i class="sw line"></i>Mínimo aprobatorio (${fmt(min)}/20)</span></div>`;
}

/* ---------- views ---------- */
const views = {};

views.resumen = () => {
  const evs = scopeEvals(), all = stats(evs), ex = examStats(evs), risk = riskList(evs);
  const vis = scopeVis().filter(v => v.estado !== 'Vacante');
  const vs = visStats(evs);
  const evaluated = new Set(evs.map(e => e.vid));
  const pending = vis.filter(v => !evaluated.has(v.id) && v.estado === 'Activo');
  const withAvg = ex.filter(e => e.avg != null);
  const hard = withAvg.length ? withAvg.reduce((a,b) => (b.avg < a.avg || (b.avg === a.avg && b.rate < a.rate)) ? b : a) : null;
  const easy = withAvg.length ? withAvg.reduce((a,b) => (b.avg > a.avg || (b.avg === a.avg && b.rate > a.rate)) ? b : a) : null;
  const noShow = evs.filter(e => e.estado === 'No presentó').length;

  let h = '';
  if (risk.length) {
    h += `<section class="risk" aria-label="Visitadores en riesgo académico">
      <div class="risk-h"><span style="font-size:22px" aria-hidden="true">⚠</span><div><h2>${risk.length} visitador${risk.length>1?'es':''} en riesgo académico</h2>
      <p>Promedio o alguna evaluación por debajo de ${fmt(S.config.min)}/20, o evaluación no presentada. Crítico = promedio bajo el mínimo o alguna nota &lt; 10.</p></div></div>
      <div class="risk-list">${risk.map(r => `<div class="risk-item">
        <div class="nm"><span>${esc(fullName(r.v))}<br><small class="muted">${esc(r.v.linea)} · ${esc(r.v.zona)}</small></span>
        <span class="status ${r.level==='crítico'?'bad':'warn'}">${r.level==='crítico'?'✕ Crítico':'! Alerta'}</span></div>
        <ul>${r.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        <div class="kv"><span>Promedio <b class="num">${fmt(r.avg)}</b></span><span>Evaluaciones <b>${r.total}</b></span></div></div>`).join('')}</div></section>`;
  } else if (evs.length) {
    h += `<div class="risk-ok"><span class="status good">✓</span> Ningún visitador en riesgo académico con el mínimo actual (${fmt(S.config.min)}/20).</div>`;
  }

  h += `<div class="grid g-kpi">
    <div class="card kpi"><div class="lbl">Promedio general</div><div class="val num ${all.avg!=null&&all.avg<S.config.min?'t-bad':''}">${fmt(all.avg, 2)} <small>/20</small></div><div class="foot">${all.n} notas contabilizadas${noShow&&!S.config.ausCero?` · ${noShow} ausencias excluidas`:''}</div></div>
    <div class="card kpi"><div class="lbl">Tasa de aprobación</div><div class="val num ${all.rate!=null&&all.rate<.8?'t-warn':'t-good'}">${pct(all.rate)}</div><div class="foot">${all.pass} de ${all.n} evaluaciones ≥ ${fmt(S.config.min)}</div></div>
    <div class="card kpi"><div class="lbl">Visitadores evaluados</div><div class="val num">${vs.length} <small>/ ${vis.length}</small></div><div class="foot">${pending.length} activos sin evaluación</div></div>
    <div class="card kpi"><div class="lbl">En riesgo académico</div><div class="val num ${risk.length?'t-bad':'t-good'}">${risk.length}</div><div class="foot">${risk.filter(r=>r.level==='crítico').length} críticos · ${risk.filter(r=>r.level!=='crítico').length} en alerta</div></div>
    <div class="card kpi"><div class="lbl">▲ Mayor dificultad</div><div class="val txt">${hard?esc(hard.examen):'—'}</div><div class="foot">${hard?`Promedio ${fmt(hard.avg)} · Aprobación ${pct(hard.rate)} · n=${hard.n}`:''}</div></div>
    <div class="card kpi"><div class="lbl">▽ Menor dificultad</div><div class="val txt">${easy?esc(easy.examen):'—'}</div><div class="foot">${easy?`Promedio ${fmt(easy.avg)} · Aprobación ${pct(easy.rate)} · n=${easy.n}`:''}</div></div>
  </div>`;

  const exRows = ex.map(e => Object.assign({}, e, {dif: e === hard ? 'Mayor' : e === easy ? 'Menor' : ''}));
  h += `<div class="grid g-2" style="margin-top:16px">
    <div class="card"><div class="card-h"><div><h2>Promedio por examen / capacitación</h2><p class="sub">Escala 0–20 · la línea vertical marca el mínimo aprobatorio</p></div></div>
      <div class="card-b">${bars([...ex].sort((a,b)=>(a.avg??99)-(b.avg??99)).map(e => ({label:esc(e.examen), value:e.avg, tip:`${e.examen}: promedio ${fmt(e.avg,2)} · aprobación ${pct(e.rate)} · n=${e.n}`})))}</div>
      ${table('exams', [
        {k:'examen', label:'Examen', f:r => `${esc(r.examen)} ${r.dif==='Mayor'?'<span class="status bad">▲ Mayor dificultad</span>':r.dif==='Menor'?'<span class="status good">▽ Menor dificultad</span>':''}`},
        {k:'n', label:'N', r:1},
        {k:'avg', label:'Promedio', r:1, f:r => avgBadge(r.avg)},
        {k:'rate', label:'Aprobación', r:1, f:r => `<span class="${r.rate!=null&&r.rate<.8?'t-warn':''}">${pct(r.rate)}</span>`},
        {k:'min', label:'Mín–Máx', r:1, f:r => r.n ? `${fmt(r.min)}–${fmt(r.max)}` : '—'},
        {k:'fechas', label:'Fecha', sv:r => r.fechas[0]||'', f:r => r.fechas.length ? r.fechas.map(fdate).join(', ') : '<span class="muted">Sin fecha</span>'}
      ], exRows, {defaultSort:{k:'avg', dir:1}})}
    </div>
    <div class="card"><div class="card-h"><div><h2>Promedio acumulado por visitador</h2><p class="sub">${vs.length} visitadores con evaluaciones</p></div>
      <button class="btn sm" data-act="rank-dir">${UI.rankDir==='asc'?'Menor → mayor':'Mayor → menor'}</button></div>
      <div class="card-b" style="max-height:620px;overflow:auto">${bars(vs.filter(s => matchesQ(fullName(s.v), s.v.linea)).sort((a,b)=>((a.avg??-1)-(b.avg??-1))*(UI.rankDir==='asc'?1:-1)).map(s => ({
        label:`${esc(fullName(s.v))} <small>${esc(shortLine(s.v.linea))}</small>`, value:s.avg,
        tip:`${fullName(s.v)} (${s.v.linea}) · promedio ${fmt(s.avg,2)} · ${s.n} notas · ${s.list.map(e=>e.examen+': '+(e.estado==='No presentó'?'NP':fmt(e.nota))).join(' | ')}`})))}</div></div>
  </div>`;

  const byLine = LINES.concat(['SIN ASIGNAR']).map(l => { const st = stats(evs.filter(e => (VM()[e.vid]||{}).linea === l)); return {l, ...st}; }).filter(x => x.total);
  h += `<div class="grid g-2" style="margin-top:16px">
    <div class="card"><div class="card-h"><div><h2>Promedio por línea</h2><p class="sub">Agregado de todas las evaluaciones de la línea</p></div></div>
      <div class="card-b">${bars(byLine.map(x => ({label:esc(x.l), value:x.avg, tip:`${x.l}: promedio ${fmt(x.avg,2)} · aprobación ${pct(x.rate)} · ${x.n} notas`})))}</div></div>
    <div class="card"><div class="card-h"><div><h2>Visitadores activos sin evaluaciones</h2><p class="sub">Cobertura pendiente de capacitación</p></div></div>
      ${table('pending', [
        {k:'nombre', label:'Visitador', sv:r=>fullName(r), f:r => esc(fullName(r))},
        {k:'linea', label:'Línea', f:r => `<span class="pill">${esc(r.linea)}</span>`},
        {k:'zona', label:'Zona'}
      ], pending.filter(v => matchesQ(fullName(v), v.linea, v.zona)), {empty:'Todos los visitadores activos tienen al menos una evaluación.'})}
    </div></div>`;
  return h;
};

  const rows = list.map(v => { const evs = evAll.filter(e => e.vid === v.id); return Object.assign({}, v, {full:fullName(v), evs, st:stats(evs)}); });
  const lineCards = LINES.concat(['SIN ASIGNAR']).map(l => {
    const vs = S.visitadores.filter(v => v.linea === l && v.estado !== 'Inactivo');

  }).join('');

      {k:'apellidos', label:'Apellidos'},
      {k:'correo', label:'Correo', f:r => r.correo ? `<span class="mono">${esc(r.correo)}</span>` : '<span class="muted">—</span>'},
      {k:'linea', label:'Línea', f:r => `<span class="pill">${esc(r.linea)}</span>`},
      {k:'zona', label:'Región / Zona', f:r => `${esc(r.zona)}<br><small class="muted">${esc(r.region)}</small>`},

      {k:'n', label:'Evals', r:1, sv:r => r.evs.length, f:r => r.evs.length},

function historyTable(v){
  if (!v.evs.length) return '<span class="muted">Sin evaluaciones registradas.</span> <button class="btn sm" data-act="add-eval" data-vid="'+v.id+'">＋ Agregar evaluación</button>';
  return `<table><thead><tr><th>Examen / Capacitación</th><th>Fecha</th><th class="r">Nota /20</th><th class="r">Pts Kahoot</th><th>Estado</th><th></th></tr></thead><tbody>
    ${v.evs.map(e => `<tr><td>${esc(e.examen)}${e.obs?`<br><small class="muted">${esc(e.obs)}</small>`:''}</td><td>${e.fecha?fdate(e.fecha):'<span class="muted">Sin fecha</span>'}</td><td class="r num"><b>${e.estado==='No presentó'?'—':fmt(e.nota)}</b></td><td class="r num">${e.kahoot!=null?e.kahoot.toLocaleString('es-VE'):'—'}</td><td>${statusBadge(e)}</td>
    <td><button class="iconbtn" data-act="edit-eval" data-id="${e.id}" aria-label="Editar">✎</button><button class="iconbtn del" data-act="del-eval" data-id="${e.id}" aria-label="Eliminar">🗑</button></td></tr>`).join('')}
    </tbody></table><div style="margin-top:8px"><button class="btn sm" data-act="add-eval" data-vid="${v.id}">＋ Agregar evaluación</button></div>`;
}

views.port = () => {
  const P = S.portafolio;
  const q = UI.q;
  const usedAreas = AREAS.filter(a => P.some(p => p.area === a)).concat([...new Set(P.map(p=>p.area))].filter(a => !AREAS.includes(a)));
  const legend = `<div class="areas-legend">${usedAreas.map(a => `<span><i class="dot" style="background:${AREA_VAR(a)}"></i>${esc(titleCase(a))}</span>`).join('')}</div>`;
  const lines = UI.linea ? [UI.linea] : LINES;
  const products = [...new Set(P.map(p => p.producto))].sort((a,b)=>a.localeCompare(b,'es'));
  let body;
  if (UI.portView === 'cards') {
    body = `<div class="grid g-3">${lines.map(l => {
      const ps = P.filter(p => p.linea === l);
      const groups = groupBy(ps, p => p.area);
      const areaOrder = [...groups.keys()].sort((a,b) => (AREAS.indexOf(a)+99*(AREAS.indexOf(a)<0)) - (AREAS.indexOf(b)+99*(AREAS.indexOf(b)<0)));
      return `<div class="card pline" data-drop-line="${esc(l)}">
        <div class="card-h"><div><h2>${esc(l)}</h2><p class="sub">${ps.length} productos · ${groups.size} áreas terapéuticas</p></div>
        <button class="btn sm" data-act="add-prod" data-line="${esc(l)}">＋ Producto</button></div>
        <div class="card-b">${areaOrder.map(a => `<div class="agroup"><h4><i class="dot" style="background:${AREA_VAR(a)}"></i>${esc(titleCase(a))} <span class="muted">(${groups.get(a).length})</span></h4>
          <div class="chips">${groups.get(a).map(p => `<span class="chip ${q && nrm(p.producto+' '+p.area).includes(q) ? 'hl':''}" draggable="true" data-pid="${p.id}" title="Arrastra a otra línea para moverlo">${esc(p.producto)}
            <button class="mv" data-act="move-prod" data-id="${p.id}" title="Mover / copiar a otra línea" aria-label="Mover">⇄</button><button class="x" data-act="del-prod" data-id="${p.id}" title="Quitar de ${esc(l)}" aria-label="Eliminar">×</button></span>`).join('')}</div></div>`).join('') || '<div class="empty">Sin productos. Arrastra aquí.</div>'}</div></div>`;
    }).join('')}</div>`;
  } else {
    const filtered = products.filter(pr => !q || nrm(pr + ' ' + (P.find(p=>p.producto===pr)||{}).area).includes(q));
    body = `<div class="card"><div class="tbl-wrap"><table class="matrix"><thead><tr><th>Producto</th><th>Área terapéutica</th>${lines.map(l => `<th class="c">${esc(shortLine(l))}</th>`).join('')}<th class="c">Líneas</th></tr></thead><tbody>
      ${filtered.map(pr => { const area = (P.find(p => p.producto === pr)||{}).area; const n = lines.filter(l => P.some(p => p.producto===pr && p.linea===l)).length;
        return `<tr><td><b>${esc(pr)}</b></td><td><i class="dot" style="background:${AREA_VAR(area)}"></i> ${esc(titleCase(area))}</td>${lines.map(l => { const on = P.some(p => p.producto===pr && p.linea===l);
          return `<td class="c"><span class="tick ${on?'':'off'}" role="checkbox" aria-checked="${on}" tabindex="0" data-act="toggle-cell" data-prod="${esc(pr)}" data-line="${esc(l)}" data-area="${esc(area)}" title="${on?'Quitar de':'Agregar a'} ${esc(l)}">✓</span></td>`; }).join('')}<td class="c num">${n}</td></tr>`; }).join('')}
      <tr><th>Total</th><th></th>${lines.map(l => `<th class="c num">${P.filter(p=>p.linea===l).length}</th>`).join('')}<th></th></tr>
      </tbody></table></div></div>`;
  }
  return `<div class="section-title" style="margin-top:0"><div><h2>Portafolio de productos por línea · Octubre 2026</h2>
    <p class="muted" style="margin:2px 0 0;font-size:12.5px">${P.length} asignaciones · ${products.length} productos únicos. Arrastra un producto a otra línea para moverlo (mantén <b>Ctrl/⌥</b> al soltar para copiarlo).</p></div>
    <div class="toolbar"><button class="btn ${UI.portView==='cards'?'primary':''}" data-act="port-view" data-v="cards">Por línea</button><button class="btn ${UI.portView==='matrix'?'primary':''}" data-act="port-view" data-v="matrix">Matriz producto × línea</button><button class="btn" data-act="add-prod">＋ Nuevo producto</button></div></div>
    <div style="margin-bottom:12px">${legend}</div>${body}`;
};

/* ---------- Kahoot parsing ---------- */
function splitRow(line, d){
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) { const c = line[i];
    if (c === '"') { if (q && line[i+1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === d && !q) { out.push(cur.trim()); cur = ''; } else cur += c; }
  out.push(cur.trim()); return out;
}
function parseNum(s){ if (s == null || s === '') return null; const t = String(s).replace(/\s| /g,'').replace(',', '.'); const n = parseFloat(t); return isNaN(n) ? null : n; }
function parsePoints(s){ if (s == null || s === '') return null; const d = String(s).replace(/\D/g,''); return d ? parseInt(d,10) : null; }
function parseNota(s){
  if (s == null || String(s).trim() === '') return null; const t = String(s).trim();
  let m = t.match(/^([\d.,]+)\s*\/\s*([\d.,]+)$/); if (m) { const a = parseNum(m[1]), b = parseNum(m[2]); return b ? a/b*20 : null; }
  m = t.match(/^([\d.,]+)\s*%$/); if (m) return parseNum(m[1]) / 100 * 20;
  const n = parseNum(t); if (n == null) return null;
  if (n <= 1) return n * 20; if (n <= 20) return n; if (n <= 100) return n / 100 * 20; return null;
}
function matchVis(name, email){
  const vs = S.visitadores.filter(v => v.estado !== 'Vacante');
  if (email) { const v = vs.find(v => v.correo && nrm(v.correo) === nrm(email)); if (v) return {vid:v.id, by:'por correo'}; }
  const toks = nrm(name).replace(/[^a-z0-9 ]/g,' ').split(' ').filter(t => t.length > 1);
  if (!toks.length) return {vid:'', by:''};
  let best = null, bestScore = 0, tie = false;
  vs.forEach(v => { const vt = nrm(fullName(v)).split(' '); const sc = toks.filter(t => vt.includes(t)).length + (nrm(fullName(v)) === toks.join(' ') ? 5 : 0);
    if (sc > bestScore) { best = v; bestScore = sc; tie = false; } else if (sc === bestScore && sc > 0) tie = true; });
  if (best && bestScore >= 2 && !tie) return {vid:best.id, by:'por nombre'};
  if (best && bestScore === 1 && !tie && toks.length === 1) return {vid:best.id, by:'coincidencia parcial — verificar'};
  return {vid:'', by:tie ? 'nombre ambiguo' : 'sin coincidencia'};
}
function kahootParse(){
  const text = $('#kText').value, exam = $('#kExam').value.trim(), date = $('#kDate').value, n = parseInt($('#kN').value,10) || null;
  let mode = $('#kMode').value;
  UI.kahoot = {text, exam, date, n, mode};
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) { toast('Pega o arrastra un reporte primero.'); return; }
  const d = lines[0].includes('\t') ? '\t' : (lines[0].split(';').length > lines[0].split(',').length ? ';' : ',');
  let rows = lines.map(l => splitRow(l, d));
  const hdr = rows[0].map(nrm);
  const find = (re, not) => hdr.findIndex(h => re.test(h) && !(not && not.test(h)));
  const hasHeader = hdr.some(h => /player|jugador|nombre|name|participante|correo|email|score|punt|nota|correct/.test(h));
  let ix;
  if (hasHeader) {
    ix = { name:find(/player|jugador|nombre|participante|nickname|^name|apellido/), email:find(/correo|e-?mail|mail/),
      correct:find(/correct|correctas|aciertos/, /incorrect/), incorrect:find(/incorrect|incorrectas|errores|fallos/),
      points:find(/score|puntaje|puntos|puntuacion|kahoot|points/, /nota|ponderal/), nota:find(/nota|calificacion|grade|ponderal/),
      exam:find(/examen|tema|quiz|evaluacion|capacitacion/), date:find(/fecha|date/) };
    rows = rows.slice(1);
  } else {
    ix = { name:0, email:rows[0].findIndex(c => c.includes('@')), correct:-1, incorrect:-1, points:-1, nota:-1, exam:-1, date:-1 };
    const numCol = rows[0].findIndex((c,i) => i > 0 && parseNota(c) != null && !c.includes('@'));
    ix.nota = numCol;
  }
  if (ix.name < 0) { toast('No se encontró la columna de nombre/jugador.'); return; }
  const get = (r, k) => ix[k] >= 0 ? r[ix[k]] : null;
  const parsed = rows.filter(r => (get(r,'name')||'').trim() && !/^(rank|total|promedio)/i.test(get(r,'name'))).map(r => {
    const correct = parseNum(get(r,'correct')), incorrect = parseNum(get(r,'incorrect'));
    return { name:get(r,'name').trim(), email:(get(r,'email')||'').trim(), points:parsePoints(get(r,'points')), correct, incorrect,
      notaRaw:get(r,'nota'), exam:(get(r,'exam')||'').trim(), date:(get(r,'date')||'').trim() };
  });
  if (mode === 'auto') mode = ix.nota >= 0 ? 'nota' : ix.correct >= 0 ? 'correct' : ix.points >= 0 ? (n ? 'pointsMax' : 'pointsTop') : 'nota';
  const top = Math.max(0, ...parsed.map(r => r.points || 0));
  let info = '';
  parsed.forEach(r => {
    if (mode === 'nota') r.nota = parseNota(r.notaRaw);
    else if (mode === 'correct') { r.total = n || ((r.correct ?? 0) + (r.incorrect ?? 0)) || null; r.nota = r.correct != null && r.total ? r.correct / r.total * 20 : null; }
    else if (mode === 'pointsMax') { r.nota = n && r.points != null ? Math.min(20, r.points / (n * 1000) * 20) : null; }
    else if (mode === 'pointsTop') { r.nota = top && r.points != null ? r.points / top * 20 : null; }
    if (r.nota != null) r.nota = Math.round(r.nota * 100) / 100;
    const m = matchVis(r.name, r.email); r.vid = m.vid; r.matchBy = m.by;
    if (r.date) { const dm = r.date.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); r.date = dm ? `${dm[3]}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}` : (/^\d{4}-\d{2}-\d{2}$/.test(r.date) ? r.date : ''); }
  });
  if (mode === 'pointsMax' && !n) info = 'indica el N° de preguntas';
  if (mode === 'pointsTop') info = `mejor puntaje = ${top.toLocaleString('es-VE')} pts → 20/20`;
  const labels = {nota:'Nota directa', correct:'Correctas ÷ total × 20', pointsMax:'Puntos ÷ (N×1000) × 20', pointsTop:'Puntos ÷ mejor puntaje × 20'};
  UI.kahoot = Object.assign(UI.kahoot, {rows:parsed, modeLabel:labels[mode], info});
  render();
  setTimeout(() => { const s = $('#kMode'); if (s) s.value = UI.kahoot.mode; }, 0);
}
async function kahootCommit(){
  const k = UI.kahoot; if (!k || !k.rows) return;
  const replace = $('#kReplace')?.checked;
  const exam = $('#kExam').value.trim() || k.exam;
  if (!exam && k.rows.some(r => !r.exam)) { toast('Indica el nombre del examen / capacitación.'); $('#kExam').focus(); return; }
  let added = 0, replaced = 0, created = 0; const ops = [];
  k.rows.forEach(r => {
    if (!r.vid || r.nota == null) return;
    let vid = r.vid;
    if (vid === '__new') {
      const parts = titleCase(r.name).split(' ');
      const v = {id:uid('v'), nombre:parts[0]||'', apellidos:parts.slice(1).join(' '), correo:r.email||'', linea:UI.linea||'SIN ASIGNAR', region:'—', zona:'—', estado:'Activo'};
      ops.push({col:'visitadores', rec:v}); vid = v.id; created++;
    } else { const cur = S.visitadores.find(v => v.id === vid); if (r.email && cur && !cur.correo) ops.push({col:'visitadores', rec:Object.assign({}, cur, {correo:r.email})}); }
    const ex = r.exam || exam;
    const rec = {id:uid('e'), vid, examen:ex, fecha:r.date || $('#kDate').value || '', nota:r.nota, kahoot:r.points, estado:'Presentó', origen:'Carga Kahoot '+today()};
    const prev = S.evaluaciones.findIndex(e => e.vid === vid && nrm(e.examen) === nrm(ex));
    if (prev >= 0 && replace) { rec.id = S.evaluaciones[prev].id; replaced++; } else added++;
    ops.push({col:'evaluaciones', rec});
  });
  const okLabel = $('[data-act="k-commit"]'); if (okLabel) { okLabel.disabled = true; okLabel.textContent = 'Guardando…'; }
  const ok = await runOps(ops);
  if (ok < ops.length) { if (okLabel) { okLabel.disabled = false; okLabel.textContent = 'Reintentar registro'; } return; }
  UI.kahoot = null;
  toast(`Registradas ${added} notas nuevas${replaced?`, ${replaced} reemplazadas`:''}${created?`, ${created} visitadores creados`:''}. Métricas recalculadas.`);
  UI.tab = 'resumen'; render();
}

  const missing = $$('#modalBody [required]').find(i => !String(i.value).trim());
  if (missing) { missing.focus(); toast('Completa los campos obligatorios.'); return; }
  if (modalSubmit && modalSubmit(data) !== false) { closeModal(); schedule(); }
});
$$('[data-close]').forEach(b => b.addEventListener('click', closeModal));
$('#modalBg').addEventListener('mousedown', e => { if (e.target.id === 'modalBg') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('#dataMenu').classList.remove('on'); } });

const lineOpts = () => LINES.concat(['SIN ASIGNAR']);
function visForm(v){
  const isNew = !v; v = v || {estado:'Activo', linea:UI.linea || LINES[0]};
  const zonas = [...new Set(S.visitadores.map(x => x.zona).filter(z => z && z !== '—'))].sort();
  const regiones = [...new Set(S.visitadores.map(x => x.region).filter(z => z && z !== '—'))].sort();
  openForm(isNew ? 'Nuevo visitador' : 'Editar visitador', [
    {k:'nombre', label:'Nombre *', req:1}, {k:'apellidos', label:'Apellidos *', req:1},
    {k:'correo', label:'Correo', type:'email', full:1},
    {k:'linea', label:'Línea', type:'select', options:lineOpts()},
    {k:'estado', label:'Estado', type:'select', options:['Activo','Inactivo','Vacante','Fuera de estructura']},
    {k:'region', label:'Región', list:'dlReg', listOpts:regiones}, {k:'zona', label:'Zona', list:'dlZona', listOpts:zonas}
  ], v, d => {
    if (d.correo && !/^\S+@\S+\.\S+$/.test(d.correo)) { toast('Correo no válido.'); return false; }
    d.nombre = d.nombre.trim(); d.apellidos = d.apellidos.trim(); d.correo = d.correo.trim();
    const rec = Object.assign({}, isNew ? {id:uid('v')} : S.visitadores.find(x => x.id === v.id), d);
    put('visitadores', rec).then(ok => ok && toast(isNew ? 'Visitador agregado.' : 'Visitador actualizado.'));
  });
}
function evalForm(e, vid){
  const isNew = !e; e = e || {vid:vid || UI.vis || '', fecha:today(), estado:'Presentó'};
  const vs = [...S.visitadores].filter(v => v.estado !== 'Vacante').sort((a,b) => fullName(a).localeCompare(fullName(b),'es'));
  openForm(isNew ? 'Nueva evaluación' : 'Editar evaluación', [
    {k:'vid', label:'Visitador *', type:'select', req:1, full:1, options:[['','— Selecciona —']].concat(vs.map(v => [v.id, `${fullName(v)} · ${v.linea}`]))},
    {k:'examen', label:'Examen / Capacitación *', req:1, full:1, list:'dlEx', listOpts:[...new Set(S.evaluaciones.map(x=>x.examen))]},
    {k:'fecha', label:'Fecha', type:'date'},
    {k:'estado', label:'Estado', type:'select', options:['Presentó','No presentó']},
    {k:'nota', label:'Nota (x/20, % o 0–20)', def:'', attrs:'placeholder="18/20"'},
    {k:'kahoot', label:'Puntos Kahoot', type:'number', attrs:'min="0"'},
    {k:'obs', label:'Observación', full:1}
  ], Object.assign({}, e, {nota: e.nota != null ? String(e.nota) : ''}), d => {
    const nota = d.estado === 'No presentó' ? 0 : parseNota(d.nota);
    if (d.estado === 'Presentó' && (nota == null || nota > 20)) { toast('Nota no válida. Usa 18/20, 90% o un valor de 0 a 20.'); return false; }
    const rec = {vid:d.vid, examen:d.examen.trim(), fecha:d.fecha, estado:d.estado, nota:Math.round(nota*100)/100, kahoot:parsePoints(d.kahoot), obs:d.obs};
    const full = Object.assign({}, isNew ? {id:uid('e'), origen:'Manual'} : S.evaluaciones.find(x => x.id === e.id), rec);
    put('evaluaciones', full).then(ok => ok && toast(isNew ? 'Evaluación agregada.' : 'Evaluación actualizada.'));
  });
}
function prodForm(line){
  const prods = [...new Set(S.portafolio.map(p => p.producto))].sort();
  openForm('Nuevo producto', [
    {k:'producto', label:'Producto *', req:1, list:'dlProd', listOpts:prods},
    {k:'area', label:'Área terapéutica', type:'select', options:AREAS.map(a => [a, titleCase(a)])},
    {k:'linea', label:'Línea', type:'select', full:1, options:[['__all','Todas las líneas']].concat(LINES.map(l=>[l,l]))}
  ], {linea:line || UI.linea || LINES[0]}, d => {
    const name = d.producto.trim().toUpperCase(); const lines = d.linea === '__all' ? LINES : [d.linea]; let n = 0;
    const ops = lines.filter(l => !S.portafolio.some(p => p.producto === name && p.linea === l)).map(l => ({col:'portafolio', rec:{id:uid('p'), linea:l, area:d.area, producto:name}}));
    n = ops.length; runOps(ops);
    toast(n ? `${name} agregado a ${n} línea(s).` : `${name} ya existía en la(s) línea(s) seleccionada(s).`);
  });
}
function moveForm(p){
  openForm(`Mover / copiar ${p.producto}`, [
    {k:'info', type:'info', full:1, html:`Actualmente en <b>${esc(p.linea)}</b> · ${esc(titleCase(p.area))}`},
    {k:'dest', label:'Línea destino', type:'select', options:LINES.filter(l => l !== p.linea)},
    {k:'modo', label:'Acción', type:'select', options:[['move','Mover (quitar de la línea actual)'],['copy','Copiar (mantener en ambas)']]},
    {k:'area', label:'Área terapéutica', type:'select', full:1, options:AREAS.map(a => [a, titleCase(a)])}
  ], {area:p.area}, d => movePart(p.id, d.dest, d.modo === 'copy', d.area), 'Aplicar');
}
function movePart(pid, dest, copy, area){
  const p = S.portafolio.find(x => x.id === pid); if (!p || p.linea === dest) return;
  if (S.portafolio.some(x => x.producto === p.producto && x.linea === dest)) { toast(`${p.producto} ya está en ${dest}.`); if (!copy) del('portafolio', pid); return; }
  if (copy) put('portafolio', {id:uid('p'), linea:dest, area:area||p.area, producto:p.producto});
  else put('portafolio', Object.assign({}, p, {linea:dest}, area ? {area} : {}));
  toast(`${p.producto} ${copy?'copiado':'movido'} a ${dest}.`);
}
function medForm(m, line){
  const isNew = !m; m = m || {vid:UI.vis || ''};
  line = line || (m.vid && VM()[m.vid] ? VM()[m.vid].linea : UI.linea);
  const vs = S.visitadores.filter(v => v.linea === line && v.estado !== 'Vacante' && v.estado !== 'Inactivo');
  const esp = S.fichero.filter(f => (f.cuota[line]||0) > 0).map(f => f.esp);
  openForm(isNew ? 'Agregar médico al fichero' : 'Editar médico', [
    {k:'nombre', label:'Nombre del médico *', req:1, full:1},
    {k:'esp', label:'Especialidad', type:'select', options:esp.length ? esp : S.fichero.map(f=>f.esp)},
    {k:'vid', label:'Visitador *', type:'select', req:1, options:[['','— Selecciona —']].concat(vs.map(v => [v.id, fullName(v)]))},
    {k:'centro', label:'Centro de salud / Ciudad', full:1}
  ], m, d => {
    put('medicos', Object.assign({}, isNew ? {id:uid('m')} : S.medicos.find(x => x.id === m.id), d)).then(ok => ok && toast(isNew ? 'Médico agregado al fichero.' : 'Médico actualizado.'));
  });
}

async function importBackup(j){
  if (!Array.isArray(j.visitadores) || !Array.isArray(j.evaluaciones)) throw new Error('bad');
  if (DBS.mode !== 'db') { S = Object.assign(fresh(), j); save(); schedule(); toast('Respaldo importado.'); return; }
  const ops = [];
  COLS.forEach(c => { const incoming = Array.isArray(j[c]) ? j[c].filter(r => r && r.id) : []; const ids = new Set(incoming.map(r => String(r.id)));
    S[c].forEach(r => { if (!ids.has(r.id)) ops.push({col:c, del:r.id}); }); incoming.forEach(r => ops.push({col:c, rec:Object.assign({}, r, {id:String(r.id)})})); });
  toast('Importando respaldo…'); const ok = await runOps(ops);
  if (j.config) { S.config = Object.assign({min:15, ausCero:false}, j.config); await putConfig(); }
  toast(ok === ops.length ? 'Respaldo importado en la base compartida.' : `Importación incompleta: ${ok} de ${ops.length} cambios guardados.`);
}
/* ---------- exports ---------- */
function download(name, content, type){ showExport('Exportar · ' + name, String(content).replace(/^\ufeff/,'')); }
const csv = rows => '﻿' + rows.map(r => r.map(c => { const s = String(c ?? ''); return /[";\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }).join(';')).join('\n');
function exportEvals(){ const vm = VM(); download('evaluaciones_fdv.csv', csv([['Nombre','Apellidos','Correo','Línea','Zona','Examen','Fecha','Nota /20','Puntos Kahoot','Estado','Resultado']].concat(
  S.evaluaciones.map(e => { const v = vm[e.vid] || {}; return [v.nombre, v.apellidos, v.correo, v.linea, v.zona, e.examen, fdate(e.fecha), e.estado==='No presentó'?'':String(e.nota).replace('.',','), e.kahoot ?? '', e.estado, e.estado==='No presentó'?'No presentó':passes(e)?'Aprobado':'Reprobado']; }))), 'text/csv;charset=utf-8'); }
function exportFdv(){ download('fuerza_de_ventas.csv', csv([['Nombre','Apellidos','Correo','Línea','Región','Zona','Estado','Evaluaciones','Promedio']].concat(
  S.visitadores.map(v => { const st = stats(S.evaluaciones.filter(e => e.vid === v.id)); return [v.nombre, v.apellidos, v.correo, v.linea, v.region, v.zona, v.estado, st.total, st.avg!=null?st.avg.toFixed(2).replace('.',','):'']; }))), 'text/csv;charset=utf-8'); }
function exportPort(){ download('portafolio_oct2026.csv', csv([['Línea','Área terapéutica','Producto']].concat(S.portafolio.map(p => [p.linea, p.area, p.producto]))), 'text/csv;charset=utf-8'); }

/* ---------- render ---------- */
function syncFilters(){
  $('#fLinea').innerHTML = `<option value="">Todas las líneas</option>` + lineOpts().map(l => `<option ${UI.linea===l?'selected':''}>${esc(l)}</option>`).join('');
  const vs = S.visitadores.filter(v => v.estado !== 'Vacante' && (!UI.linea || v.linea === UI.linea)).sort((a,b) => fullName(a).localeCompare(fullName(b),'es'));
  if (UI.vis && !vs.some(v => v.id === UI.vis)) UI.vis = '';
  $('#fVis').innerHTML = `<option value="">Todos los visitadores</option>` + vs.map(v => `<option value="${v.id}" ${UI.vis===v.id?'selected':''}>${esc(fullName(v))}</option>`).join('');
  $('#fMin').value = S.config.min; $('#fAus').checked = !!S.config.ausCero;
}
function render(){
  const ss = $('#syncStatus');
  if (ss) {
    const st = DBS.mode === 'db' ? (DBS.canWrite ? ['good','● En vivo · datos compartidos','Los cambios se guardan en la base compartida y se ven al instante en todos los navegadores.'] : ['warn','Solo lectura','Puedes consultar el panel; para editar pide acceso de Colaborador al propietario.'])
      : DBS.mode === 'local' ? ['neutral','Modo local','Archivo local: los cambios se guardan solo en este navegador.']
      : DBS.mode === 'connecting' ? ['neutral','Conectando…',''] : ['bad','Sin conexión','No se pudo conectar con la base compartida. Recarga la página.'];
    ss.className = 'status ' + st[0]; ss.textContent = st[1]; ss.title = st[2];
  }
  document.body.classList.toggle('ro', DBS.mode === 'db' && !DBS.canWrite);
  syncFilters();
  const risk = riskList(scopeEvals()).length;
  $$('.tab').forEach(t => { t.setAttribute('aria-selected', t.dataset.tab === UI.tab); t.setAttribute('role','tab');
    if (t.dataset.tab === 'resumen') t.innerHTML = 'Métricas y KPIs' + (risk ? `<span class="cnt" title="Visitadores en riesgo">${risk}</span>` : ''); });
  const y = window.scrollY;
  const waiting = DBS.mode === 'connecting' || (DBS.mode === 'db' && DBS.loaded.size < COLS.length);
  if (DBS.mode === 'db' && !waiting && !S.visitadores.length && !S.portafolio.length && UI.tab !== 'fichero') $('#view').innerHTML = '<div class="card loading">La base compartida está vacía. Agrega visitadores en “Fuerza de Ventas” o productos en “Portafolio” para empezar.</div>' + views[UI.tab]();
  else if (waiting) $('#view').innerHTML = '<div class="card loading">Cargando datos compartidos…</div>';
  else if (DBS.mode === 'offline') $('#view').innerHTML = '<div class="card loading">No se pudo conectar con la base de datos compartida. Recarga la página o verifica que tienes acceso a este panel.</div>';
  else $('#view').innerHTML = views[UI.tab]();
  if (UI.tab === 'carga' && UI.kahoot) { const s = $('#kMode'); if (s) s.value = UI.kahoot.mode || 'auto'; }
  window.scrollTo(0, y);
  try { localStorage.setItem(LS_KEY+'-tab', UI.tab); } catch(e) {}
}

/* ---------- events ---------- */
$('#tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (!t) return; UI.tab = t.dataset.tab; render(); window.scrollTo(0,0); });
let qT; $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { UI.q = nrm(e.target.value); render(); }, 120); });
$('#fLinea').addEventListener('change', e => { UI.linea = e.target.value; render(); });
$('#fVis').addEventListener('change', e => { UI.vis = e.target.value; render(); });
$('#fMin').addEventListener('change', e => { const v = parseFloat(e.target.value); if (!isNaN(v) && v >= 0 && v <= 20) { S.config.min = v; putConfig(); } });
$('#fAus').addEventListener('change', e => { S.config.ausCero = e.target.checked; putConfig(); });
$('#btnClear').addEventListener('click', () => { UI.q = ''; UI.linea = ''; UI.vis = ''; UI.ficheroLinea = ''; $('#q').value = ''; render(); });
$('#btnTheme').addEventListener('click', () => {
  const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  r.dataset.theme = cur === 'dark' ? 'light' : 'dark'; try { localStorage.setItem(LS_KEY+'-theme', r.dataset.theme); } catch(e) {}
});
try { const t = localStorage.getItem(LS_KEY+'-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
$('#btnData').addEventListener('click', e => { e.stopPropagation(); $('#dataMenu').classList.toggle('on'); });
document.addEventListener('click', e => { if (!e.target.closest('.menu')) $('#dataMenu').classList.remove('on'); });
$('#fileJson').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.visitadores) || !Array.isArray(d.evaluaciones)) throw 0;
    importBackup(d).catch(() => toast('Archivo JSON no válido.')); } catch(err) { toast('Archivo JSON no válido.'); } };
  r.readAsText(f); e.target.value = '';
});

document.addEventListener('click', e => {
  const s = e.target.closest('th[data-sort]');
  if (s) { const key = s.dataset.sort, k = s.dataset.k, cur = UI.sort[key]; UI.sort[key] = {k, dir: cur && cur.k === k ? -cur.dir : (/(avg|nota|n|kahoot|cuota|reg|rate)$/.test(k) ? -1 : 1)}; render(); return; }
  const lc = e.target.closest('[data-line-card]');
  if (lc) { UI.linea = UI.linea === lc.dataset.lineCard ? '' : lc.dataset.lineCard; render(); return; }
  const a = e.target.closest('[data-act]');
  if (!a) { const ex = e.target.closest('tr[data-expand]'); if (ex) { const id = ex.dataset.expand; UI.open.has(id) ? UI.open.delete(id) : UI.open.add(id); render(); } return; }
  const act = a.dataset.act, id = a.dataset.id;
  const menuClose = () => $('#dataMenu').classList.remove('on');
  switch (act) {
    case 'exp-json': menuClose(); download('respaldo_fdv_oct2026.json', JSON.stringify(S, null, 1), 'application/json'); break;
    case 'imp-json': menuClose(); openForm('Importar respaldo (JSON)', [{k:'_i', type:'info', full:1, html:'Pega el contenido de un respaldo exportado desde este panel. Reemplazará los datos actuales en este navegador.'}, {k:'json', type:'textarea', full:1, attrs:'style="min-height:220px"'}], {}, d => {
      let j; try { j = JSON.parse(d.json); if (!Array.isArray(j.visitadores) || !Array.isArray(j.evaluaciones)) throw 0; } catch(err) { toast('El texto no es un respaldo JSON válido.'); return false; } importBackup(j);
    }, 'Importar'); break;
    case 'exp-evals': menuClose(); exportEvals(); break;
    case 'exp-fdv': menuClose(); exportFdv(); break;
    case 'exp-port': menuClose(); exportPort(); break;
    case 'rank-dir': UI.rankDir = UI.rankDir === 'asc' ? 'desc' : 'asc'; render(); break;
    case 'show-inactive': UI.showInactive = a.checked; render(); break;
    case 'add-vis': visForm(); break;
    case 'edit-vis': e.stopPropagation(); visForm(S.visitadores.find(v => v.id === id)); break;
    case 'toggle-vis': { e.stopPropagation(); const v = S.visitadores.find(v => v.id === id); const estado = v.estado === 'Inactivo' ? 'Activo' : 'Inactivo'; put('visitadores', Object.assign({}, v, {estado})).then(ok => ok && toast(`${fullName(v)}: ${estado}.`)); break; }
    case 'del-vis': { e.stopPropagation(); const v = S.visitadores.find(v => v.id === id); const n = S.evaluaciones.filter(x => x.vid === id).length;
      askConfirm(`¿Eliminar a ${fullName(v)}?${n ? ` También se eliminarán sus ${n} evaluaciones. Usa “Desactivar” si quieres conservar el historial.` : ''}`, () => {
        runOps([{col:'visitadores', del:id}].concat(S.evaluaciones.filter(x => x.vid === id).map(x => ({col:'evaluaciones', del:x.id})), S.medicos.filter(x => x.vid === id).map(x => ({col:'medicos', del:x.id})))).then(() => toast('Visitador eliminado.')); }); break; }
    case 'add-eval': e.stopPropagation(); evalForm(null, a.dataset.vid); break;
    case 'edit-eval': e.stopPropagation(); evalForm(S.evaluaciones.find(x => x.id === id)); break;
    case 'del-eval': e.stopPropagation(); askConfirm('¿Eliminar esta evaluación?', () => { del('evaluaciones', id).then(ok => ok && toast('Evaluación eliminada.')); }); break;
    case 'port-view': UI.portView = a.dataset.v; render(); break;
    case 'add-prod': prodForm(a.dataset.line); break;
    case 'del-prod': { const p = S.portafolio.find(x => x.id === id); askConfirm(`¿Quitar ${p.producto} de ${p.linea}?`, () => { del('portafolio', id).then(ok => ok && toast(`${p.producto} quitado de ${p.linea}.`)); }, 'Quitar'); break; }
    case 'move-prod': moveForm(S.portafolio.find(x => x.id === id)); break;
    case 'toggle-cell': { const pr = a.dataset.prod, l = a.dataset.line; const ex = S.portafolio.find(p => p.producto === pr && p.linea === l);
      if (ex) del('portafolio', ex.id); else put('portafolio', {id:uid('p'), linea:l, area:a.dataset.area, producto:pr});
      break; }
    case 'fich-line': UI.ficheroLinea = a.dataset.line; if (UI.linea && UI.linea !== a.dataset.line) UI.linea = ''; UI.vis = ''; render(); break;
    case 'add-med': medForm(null, a.dataset.line); break;
    case 'edit-med': medForm(S.medicos.find(x => x.id === id)); break;
    case 'del-med': askConfirm('¿Eliminar este médico del fichero?', () => { del('medicos', id); }); break;
    case 'k-parse': kahootParse(); break;
    case 'k-clear': UI.kahoot = null; render(); break;
    case 'k-sample': UI.kahoot = {text:KAHOOT_SAMPLE, exam:'Lanzamiento GI (ejemplo)', date:today(), mode:'auto', n:''}; render(); break;
    case 'k-commit': kahootCommit(); break;
  }
});
document.addEventListener('input', e => {
  const map = {kText:'text', kExam:'exam', kDate:'date', kN:'n', kMode:'mode'}; const f = map[e.target.id];
  if (f) { UI.kahoot = UI.kahoot || {}; UI.kahoot[f] = e.target.value; }
});
document.addEventListener('change', e => {
  const map = {kMode:'mode', kDate:'date'}; const f = map[e.target.id]; if (f) { UI.kahoot = UI.kahoot || {}; UI.kahoot[f] = e.target.value; }
  const k = e.target.closest('[data-krow]'); if (k && UI.kahoot) { const r = UI.kahoot.rows[+k.dataset.krow]; r.vid = k.value; r.matchBy = 'manual'; }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-line-card],.tick')) { e.preventDefault(); e.target.click(); }
});
/* drag & drop: portfolio + kahoot file */
let dragPid = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.chip'); if (!c) return; dragPid = c.dataset.pid; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'copyMove'; try { e.dataTransfer.setData('text/plain', dragPid); } catch(_) {} });
document.addEventListener('dragend', () => { dragPid = null; $$('.dragging,.drag-over').forEach(x => x.classList.remove('dragging','drag-over')); });
document.addEventListener('dragover', e => {
  const z = e.target.closest && e.target.closest('[data-drop-line]');
  if (z && dragPid) { e.preventDefault(); $$('.drag-over').forEach(x => x !== z && x.classList.remove('drag-over')); z.classList.add('drag-over'); return; }
  const d = e.target.closest && e.target.closest('#kDrop,#kText'); if (d && e.dataTransfer.types.includes('Files')) { e.preventDefault(); $('#kDrop').classList.add('on'); }
});
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('[data-drop-line]');
  if (z && dragPid) { e.preventDefault(); if (!(DBS.mode === 'db' && !DBS.canWrite)) movePart(dragPid, z.dataset.dropLine, e.ctrlKey || e.altKey || e.metaKey); return; }
  const d = e.target.closest && e.target.closest('#kDrop,#kText');
  if (d && e.dataTransfer.files.length) { e.preventDefault(); $('#kDrop').classList.remove('on'); const f = e.dataTransfer.files[0];
    if (/\.xlsx?$/i.test(f.name)) { toast('Para Excel: abre el archivo, copia las celdas y pégalas aquí.'); return; }
    const r = new FileReader(); r.onload = () => { $('#kText').value = r.result; toast(`Archivo ${f.name} cargado. Pulsa “Procesar”.`); }; r.readAsText(f); }
});
/* tooltip */
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t || !t.dataset.tip) { tip.style.display = 'none'; return; }
  tip.textContent = t.dataset.tip; tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 12) + 'px';
  tip.style.top = (e.clientY + 16 + h > window.innerHeight ? e.clientY - h - 10 : e.clientY + 16) + 'px';
});
render();
connect();
